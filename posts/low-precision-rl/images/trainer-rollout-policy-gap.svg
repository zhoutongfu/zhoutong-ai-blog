<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">One token scored by three policy executions</title>
  <desc id="desc">The trainer at version t, the rollout engine at the same version t, and the behavior rollout at an older version tau score the same token and prefix. Their pairwise differences separate same-version precision mismatch from rollout staleness.</desc>
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 32px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 17px; fill: #475569; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; fill: #64748b; }
      .card-title { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .body { font-size: 15px; fill: #475569; }
      .small { font-size: 13px; fill: #64748b; }
      .value { font-size: 19px; font-weight: 700; fill: #0f172a; }
      .compare-title { font-size: 16px; font-weight: 700; }
      .compare-body { font-size: 13px; fill: #475569; }
    </style>
  </defs>

  <rect width="1400" height="760" fill="url(#bg1)"/>
  <rect x="28" y="24" width="1344" height="710" rx="26" fill="#ffffff" stroke="#dbe4f0" filter="url(#shadow1)"/>

  <text x="70" y="76" class="sans title">One token, three policy executions</text>
  <text x="70" y="108" class="sans subtitle">Hold the token and prefix fixed before attributing a probability difference to precision or staleness.</text>

  <rect x="70" y="142" width="250" height="530" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="96" y="181" class="sans eyebrow">FIXED INPUT</text>
  <rect x="96" y="211" width="198" height="104" rx="16" fill="#ffffff" stroke="#94a3b8"/>
  <text x="195" y="250" text-anchor="middle" class="sans card-title">prefix sₜ</text>
  <text x="195" y="281" text-anchor="middle" class="sans body">identical token history</text>
  <rect x="96" y="337" width="198" height="104" rx="16" fill="#ffffff" stroke="#94a3b8"/>
  <text x="195" y="376" text-anchor="middle" class="sans card-title">token aₜ</text>
  <text x="195" y="407" text-anchor="middle" class="sans body">same sampled action</text>
  <text x="195" y="488" text-anchor="middle" class="sans small">No independent sampling</text>
  <text x="195" y="510" text-anchor="middle" class="sans small">during this comparison</text>

  <line x1="320" y1="260" x2="382" y2="260" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow1)"/>
  <line x1="320" y1="389" x2="382" y2="389" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow1)"/>
  <line x1="320" y1="518" x2="382" y2="518" stroke="#475569" stroke-width="2.2" marker-end="url(#arrow1)"/>

  <g transform="translate(390 190)">
    <rect width="440" height="140" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.8"/>
    <rect x="20" y="20" width="100" height="28" rx="14" fill="#2563eb"/>
    <text x="70" y="39" text-anchor="middle" class="sans small" fill="#ffffff" font-weight="700">TRAINER</text>
    <text x="20" y="78" class="sans card-title">πₜ at Wₜ</text>
    <text x="20" y="105" class="sans body">trainer format · scales · layout · kernels</text>
    <text x="416" y="82" text-anchor="end" class="sans value">log πₜ(aₜ|sₜ)</text>
    <text x="416" y="108" text-anchor="end" class="sans small">current learner score</text>
  </g>

  <g transform="translate(390 359)">
    <rect width="440" height="140" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="1.8"/>
    <rect x="20" y="20" width="176" height="28" rx="14" fill="#ea580c"/>
    <text x="108" y="39" text-anchor="middle" class="sans small" fill="#ffffff" font-weight="700">SAME-VERSION ROLLOUT</text>
    <text x="20" y="78" class="sans card-title">μₜ at Wₜ</text>
    <text x="20" y="105" class="sans body">rollout format · scales · layout · kernels</text>
    <text x="416" y="82" text-anchor="end" class="sans value">log μₜ(aₜ|sₜ)</text>
    <text x="416" y="128" text-anchor="end" class="sans small">counterfactual same version</text>
  </g>

  <g transform="translate(390 528)">
    <rect width="440" height="140" rx="18" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.8"/>
    <rect x="20" y="20" width="142" height="28" rx="14" fill="#16a34a"/>
    <text x="91" y="39" text-anchor="middle" class="sans small" fill="#ffffff" font-weight="700">BEHAVIOR ROLLOUT</text>
    <text x="20" y="78" class="sans card-title">μτ at Wτ</text>
    <text x="20" y="105" class="sans body">the execution that generated the token</text>
    <text x="416" y="82" text-anchor="end" class="sans value">log μτ(aₜ|sₜ)</text>
    <text x="416" y="128" text-anchor="end" class="sans small">τ ≤ t in an async system</text>
  </g>

  <g transform="translate(875 184)">
    <path d="M0 76 H28 M14 76 V245 M0 245 H28" fill="none" stroke="#2563eb" stroke-width="3"/>
    <rect x="48" y="89" width="405" height="142" rx="18" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="72" y="118" class="sans compare-title" fill="#1d4ed8">Direct trainer–rollout</text>
    <text x="72" y="140" class="sans compare-title" fill="#1d4ed8">log-probability difference</text>
    <text x="72" y="168" class="sans body">log πₜ(aₜ|sₜ) − log μₜ(aₜ|sₜ)</text>
    <text x="72" y="194" class="sans compare-body">Same Wₜ isolates the precision configuration:</text>
    <text x="72" y="215" class="sans compare-body">quantizer, layout, kernel, routing, or state.</text>
  </g>

  <g transform="translate(875 401)">
    <path d="M0 28 H28 M14 28 V197 M0 197 H28" fill="none" stroke="#16a34a" stroke-width="3"/>
    <rect x="48" y="42" width="405" height="142" rx="18" fill="#f0fdf4" stroke="#86efac"/>
    <text x="72" y="77" class="sans compare-title" fill="#15803d">Rollout staleness term</text>
    <text x="72" y="108" class="sans body">log μₜ(aₜ|sₜ) − log μτ(aₜ|sₜ)</text>
    <text x="72" y="138" class="sans compare-body">Same rollout execution; different weight or adapter</text>
    <text x="72" y="160" class="sans compare-body">versions. The sum gives the observed gap.</text>
  </g>

  <rect x="923" y="626" width="405" height="52" rx="14" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1125" y="650" text-anchor="middle" class="sans compare-title" fill="#c2410c">Observed trainer–behavior gap</text>
  <text x="1125" y="670" text-anchor="middle" class="sans small">the log difference inside the importance ratio</text>
</svg>
