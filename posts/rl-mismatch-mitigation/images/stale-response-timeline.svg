<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">A response can become stale before it enters a queue</title><desc id="desc">Illustrative timeline. Learner versions advance from 40 to 43 during response generation, a tool wait, reward processing, and queue residence. An optional mid-response refresh changes the generating version from 40 to 41. Tokens retain generating probabilities and versions. The time axis is schematic, not measured.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526477"/></marker>
<marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#23659a"/></marker>
<marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#74509b"/></marker>
</defs>
<rect width="1200" height="600" fill="#fff"/>
<text x="40" y="40" font-size="27" fill="#172b40" text-anchor="start" font-weight="650">Staleness begins before the queue</text>
<text x="40" y="70" font-size="17" fill="#526477" text-anchor="start" font-weight="400">Illustrative schedule · widths are not measured durations</text>
<text x="40" y="130" font-size="19" fill="#172b40" text-anchor="start" font-weight="650">Learner</text>
<text x="40" y="245" font-size="19" fill="#172b40" text-anchor="start" font-weight="650">Response</text>
<text x="40" y="345" font-size="19" fill="#172b40" text-anchor="start" font-weight="650">Metadata</text>
<path d="M180 140H1150" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="180" cy="140" r="5" fill="#74509b"/>
<text x="180" y="120" font-size="18" fill="#74509b" text-anchor="middle" font-weight="600">v40</text>
<path d="M180 151V298" stroke="#e0d8e9" stroke-dasharray="4 5"/>
<circle cx="440" cy="140" r="5" fill="#74509b"/>
<text x="440" y="120" font-size="18" fill="#74509b" text-anchor="middle" font-weight="600">v41</text>
<path d="M440 151V298" stroke="#e0d8e9" stroke-dasharray="4 5"/>
<circle cx="735" cy="140" r="5" fill="#74509b"/>
<text x="735" y="120" font-size="18" fill="#74509b" text-anchor="middle" font-weight="600">v42</text>
<path d="M735 151V298" stroke="#e0d8e9" stroke-dasharray="4 5"/>
<circle cx="1010" cy="140" r="5" fill="#74509b"/>
<text x="1010" y="120" font-size="18" fill="#74509b" text-anchor="middle" font-weight="600">v43</text>
<path d="M1010 151V298" stroke="#e0d8e9" stroke-dasharray="4 5"/>
<rect x="180" y="209" width="170" height="78" rx="7" fill="#fff1e4" stroke="#ad591a"/>
<text x="265.0" y="238" font-size="18" fill="#ad591a" text-anchor="middle" font-weight="600">Generate</text>
<text x="265.0" y="265" font-size="15" fill="#526477" text-anchor="middle" font-weight="400">version 40</text>
<rect x="350" y="209" width="190" height="78" rx="7" fill="#f2f5f8" stroke="#526477"/>
<text x="445.0" y="238" font-size="18" fill="#526477" text-anchor="middle" font-weight="600">Tool wait</text>
<text x="445.0" y="265" font-size="15" fill="#526477" text-anchor="middle" font-weight="400">no policy action</text>
<rect x="540" y="209" width="220" height="78" rx="7" fill="#eaf3fa" stroke="#23659a"/>
<text x="650.0" y="238" font-size="18" fill="#23659a" text-anchor="middle" font-weight="600">Generate</text>
<text x="650.0" y="265" font-size="15" fill="#526477" text-anchor="middle" font-weight="400">version 41</text>
<rect x="760" y="209" width="170" height="78" rx="7" fill="#f2f5f8" stroke="#526477"/>
<text x="845.0" y="238" font-size="18" fill="#526477" text-anchor="middle" font-weight="600">Reward</text>
<text x="845.0" y="265" font-size="15" fill="#526477" text-anchor="middle" font-weight="400">processing</text>
<rect x="930" y="209" width="150" height="78" rx="7" fill="#f2f5f8" stroke="#526477"/>
<text x="1005.0" y="238" font-size="18" fill="#526477" text-anchor="middle" font-weight="600">Queue</text>
<text x="1005.0" y="265" font-size="15" fill="#526477" text-anchor="middle" font-weight="400">completed data</text>
<path d="M540 174V204" fill="none" stroke="#74509b" stroke-width="2.1" marker-end="url(#purple)"/>
<text x="555" y="184" font-size="15" fill="#74509b" text-anchor="start" font-weight="400">Optional refresh</text>
<path d="M1080 248H1140" fill="none" stroke="#526477" stroke-width="2.1" marker-end="url(#arrow)"/>
<text x="1120" y="319" font-size="18" fill="#74509b" text-anchor="middle" font-weight="600">Train</text>
<rect x="180" y="322" width="900" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="205" y="350" font-size="17" fill="#ad591a" text-anchor="start" font-weight="400">Early tokens: recorded q₄₀(a | h) and v40</text>
<text x="205" y="376" font-size="17" fill="#23659a" text-anchor="start" font-weight="400">Later tokens: recorded q₄₁(a | h) and v41</text>
<path d="M180 419V434H930V419" fill="none" stroke="#526477" stroke-width="2"/>
<path d="M930 419V434H1080V419" fill="none" stroke="#526477" stroke-width="2"/>
<text x="555" y="465" font-size="18" fill="#526477" text-anchor="middle" font-weight="550">Generation and waiting before queue entry</text>
<text x="1005" y="465" font-size="18" fill="#526477" text-anchor="middle" font-weight="550">In queue</text>
<text x="40" y="523" font-size="17" fill="#526477" text-anchor="start" font-weight="400">A refresh is one scheduling choice. Other systems pin one version for the full response.</text>
<text x="40" y="551" font-size="17" fill="#526477" text-anchor="start" font-weight="400">Version age, wall-clock age, and policy distance measure different things.</text>
<text x="40" y="579" font-size="17" fill="#526477" text-anchor="start" font-weight="400">Retaining old cached state creates hybrid behavior; record its actual sampling probabilities.</text>
</svg>
