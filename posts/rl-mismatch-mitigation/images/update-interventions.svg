<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Where mismatch mitigation enters an RL update</title><desc id="desc">Rollout forward records tokens, histories, and behavior probabilities. Trainer forward replays the tokens; its scores and the stored behavior probabilities enter the loss. Backward computes DGrad for earlier layers and WGrad for trainable tensors. WGrad enters the optimizer, which publishes weights back to both forward paths. The dashed forward-validation region fixes k=v before the update, with identical history and sampling settings; forward probability equality is measured, not assumed. Ordinary stale-data updates can use k&gt;v.</desc>
<style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#526477"/></marker>
<marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#23659a"/></marker>
<marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#74509b"/></marker>
</defs>
