<text x="50" y="609" font-size="18" fill="#23659a" text-anchor="start" font-weight="650">Forward alignment</text>
<text x="50" y="637" font-size="16" fill="#526477" text-anchor="start" font-weight="400">Quantizers · kernels · routes · state</text>
<text x="840" y="609" font-size="18" fill="#28765a" text-anchor="start" font-weight="650">Backward / optimizer precision</text>
<text x="840" y="637" font-size="16" fill="#526477" text-anchor="start" font-weight="400">No corresponding rollout backward</text>
<text x="600" y="706" font-size="15" fill="#526477" text-anchor="middle" font-weight="400">Validation fixes k = v; stale updates can use k &gt; v. Forward agreement is measured, not assumed.</text>
