<text x="570.0" y="156" font-size="17" fill="#172b40" text-anchor="middle" font-weight="400">Trainer k · rollout v</text>
<rect x="840" y="95" width="320" height="117" rx="12" fill="#f7f2fb" stroke="#74509b" stroke-width="1.6"/>
<text x="1000.0" y="127" font-size="20" fill="#74509b" text-anchor="middle" font-weight="650">Optimizer</text>
<text x="1000.0" y="156" font-size="17" fill="#172b40" text-anchor="middle" font-weight="400">Master weights and moments</text>
<text x="1000.0" y="180" font-size="17" fill="#172b40" text-anchor="middle" font-weight="400">Retain and apply WGrad</text>
<rect x="50" y="260" width="260" height="100" rx="12" fill="#fff6ed" stroke="#ad591a" stroke-width="1.6"/>
<text x="180.0" y="292" font-size="20" fill="#ad591a" text-anchor="middle" font-weight="650">Rollout FProp</text>
<text x="180.0" y="321" font-size="17" fill="#172b40" text-anchor="middle" font-weight="400">Generate from behavior q</text>
<rect x="430" y="260" width="290" height="100" rx="12" fill="#eef5fa" stroke="#23659a" stroke-width="1.6"/>
<text x="575.0" y="292" font-size="20" fill="#23659a" text-anchor="middle" font-weight="650">Trainer FProp</text>
<text x="575.0" y="321" font-size="17" fill="#172b40" text-anchor="middle" font-weight="400">Score the recorded tokens</text>
