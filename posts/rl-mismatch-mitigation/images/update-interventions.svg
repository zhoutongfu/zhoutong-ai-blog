<text x="260" y="123" font-size="16" fill="#74509b" text-anchor="start" font-weight="400">Export / install</text>
<text x="775" y="124" font-size="15" fill="#74509b" text-anchor="middle" font-weight="400">Next version</text>
<text x="383" y="394" font-size="15" fill="#23659a" text-anchor="start" font-weight="400">Replay</text>
