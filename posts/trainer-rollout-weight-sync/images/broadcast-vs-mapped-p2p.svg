<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
  <title id="title">Broadcast versus mapped P2P delivery</title>
  <desc id="desc">Both paths gather trainer weights. Broadcast delivers a complete tensor to each rank; mapped P2P prepares and delivers only the destination shard.</desc>
