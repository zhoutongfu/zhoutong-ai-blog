<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1110" viewBox="0 0 1440 1110" role="img" aria-labelledby="title desc">
  <title id="title">Delta transfer and installation</title>
  <desc id="desc">TRL uses indexed values and full changed tensor loads. Baseten uses compressed XOR and sparse GPU updates. Both require the correct CPU parent and safe activation.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="#64748b"/>
    </marker>
  </defs>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.head{font-size:27px;font-weight:700}.body{font-size:24px}.note{font-size:22px;fill:#475569}.small{font-size:20px;fill:#475569}</style>
  <rect width="1440" height="1110" fill="#fff"/>
  <text x="720" y="48" class="title" text-anchor="middle">A compact update does not determine the installation cost</text>
  <rect x="30" y="82" width="665" height="875" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="745" y="82" width="665" height="875" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="362" y="125" class="head" text-anchor="middle">TRL: indexed replacements</text>
  <text x="1077" y="125" class="head" text-anchor="middle">Baseten: compressed XOR</text>
  <rect x="85" y="155" width="555" height="90" rx="12" fill="#dbeafe" stroke="#cbd5e1" stroke-width="2"/>
  <text x="362.5" y="192" class="body" text-anchor="middle">Changed indices + new BF16 values</text>
  <text x="362.5" y="228" class="note" text-anchor="middle">Compact index/value artifact</text>
  <rect x="800" y="155" width="555" height="90" rx="12" fill="#dbeafe" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1077.5" y="192" class="body" text-anchor="middle">XOR(parent bytes, new bytes) + zstd</text>
  <text x="1077.5" y="228" class="note" text-anchor="middle">Compact compressed artifact</text>
  <path d="M 362 248 V 288" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1077 248 V 288" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="85" y="292" width="555" height="90" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="362.5" y="329" class="body" text-anchor="middle">Hub Bucket</text>
  <text x="362.5" y="365" class="note" text-anchor="middle">Download the versioned patch</text>
  <rect x="800" y="292" width="555" height="90" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1077.5" y="329" class="body" text-anchor="middle">Object storage</text>
  <text x="1077.5" y="365" class="note" text-anchor="middle">Download the versioned patch</text>
  <path d="M 362 385 V 425" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1077 385 V 425" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="85" y="429" width="555" height="126" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="362.5" y="466" class="body" text-anchor="middle">Patch the full CPU parent</text>
  <text x="362.5" y="502" class="note" text-anchor="middle">Overwrite indexed positions</text>
  <text x="362.5" y="538" class="note" text-anchor="middle">Parent 17 &#x2192; CPU snapshot 18</text>
  <rect x="800" y="429" width="555" height="126" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1077.5" y="466" class="body" text-anchor="middle">Sparse decode + CPU parent 17</text>
  <text x="1077.5" y="502" class="note" text-anchor="middle">Locate changes; reconstruct new values</text>
  <text x="1077.5" y="538" class="note" text-anchor="middle">No dense XOR array required</text>
  <path d="M 362 558 V 598" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1077 558 V 598" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="85" y="602" width="555" height="126" rx="12" fill="#ffedd5" stroke="#cbd5e1" stroke-width="2"/>
  <text x="362.5" y="639" class="body" text-anchor="middle">Load full changed tensors</text>
  <text x="362.5" y="675" class="note" text-anchor="middle">A tensor can contain few changes</text>
  <text x="362.5" y="711" class="note" text-anchor="middle">but still be loaded in full</text>
  <rect x="800" y="602" width="555" height="126" rx="12" fill="#dcfce7" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1077.5" y="639" class="body" text-anchor="middle">Map and batch absolute replacements</text>
  <text x="1077.5" y="675" class="note" text-anchor="middle">Translate to final serving destinations</text>
  <text x="1077.5" y="711" class="note" text-anchor="middle">Coalesce GPU updates</text>
  <path d="M 362 731 V 771" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1077 731 V 771" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="85" y="775" width="555" height="90" rx="12" fill="#ffedd5" stroke="#cbd5e1" stroke-width="2"/>
  <text x="362.5" y="812" class="body" text-anchor="middle">GPU installation</text>
  <text x="362.5" y="848" class="note" text-anchor="middle">Whole changed tensors</text>
  <rect x="800" y="775" width="555" height="90" rx="12" fill="#dcfce7" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1077.5" y="812" class="body" text-anchor="middle">GPU installation</text>
  <text x="1077.5" y="848" class="note" text-anchor="middle">Sparse destination updates</text>
  <text x="362" y="911" class="small" text-anchor="middle">Compact transfer; potentially dense loading</text>
  <text x="1077" y="901" class="small" text-anchor="middle">Compact transfer and sparse installation</text>
  <text x="1077" y="931" class="small" text-anchor="middle">CPU parent must advance before the next delta</text>
  <path d="M 362 960 V 992" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1077 960 V 992" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="190" y="996" width="1060" height="72" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="720" y="1033" class="body" text-anchor="middle">Both: safe installation + required ranks ready &#x2192; activate version 18</text>
  <text x="720" y="1095" class="small" text-anchor="middle">Different encodings and implementations; not a normalized performance comparison.</text>
</svg>
